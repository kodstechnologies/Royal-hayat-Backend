name: Deploy Royal-Hayat Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |

            echo "=============================="
            echo "🚀 STARTING DEPLOYMENT"
            echo "=============================="

            cd /home/ubuntu/Royal-hayat-Backend

            echo "🔄 Resetting repository..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "📦 Installing dependencies..."
            npm install --production

            echo "🔄 Restarting backend safely..."
            pm2 delete backend || true
            pm2 start src/server.js --name backend --cwd /home/ubuntu/Royal-hayat-Backend

            echo "💾 Saving PM2 process..."
            pm2 save

            echo "🌐 Restarting Nginx..."
            sudo systemctl restart nginx

            echo "=============================="
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "=============================="
