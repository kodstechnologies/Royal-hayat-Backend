name: 🚀 Deploy Royal-Hayat Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "=============================="
            echo "🚀 STARTING DEPLOYMENT"
            echo "=============================="

            cd /home/ubuntu/Royal-hayat-Backend || exit

            echo "🔄 Pulling latest code..."
            git pull https://${{ secrets.GH_TOKEN }}@github.com/kodstechnologies/Royal-hayat-Backend.git main

            echo "📦 Installing dependencies..."
            npm install

            echo "🔄 Restarting backend..."
            pm2 restart backend || pm2 start src/server.js --name backend

            echo "💾 Saving PM2 process..."
            pm2 save

            echo "🌐 Restarting Nginx..."
            sudo systemctl restart nginx

            echo "=============================="
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "=============================="
